 <div class="v14-top-grid"><section class="panel v14-chart-panel"><h2>各區域完工比例（八大區域）</h2><p class="exec-subtitle">整體完工率與各區域圖例 · 點選區域查看明細</p><div class="v14-chart-layout"><div class="exec-donut v14-donut" style="--angle:${rate.toFixed(2)}%"><div class="donut-center"><span>整體完工率</span><strong>${rate.toFixed(1)}%</strong><span>${done} / ${all.length} 筆</span></div></div><div class="v14-legend">${legend}</div></div></section><section class="panel v14-table-panel"><h2>八大區域工程概況</h2><p class="exec-subtitle">保留逾期筆數 · 點選區域查看施工區域、廠商及阻礙／缺失</p><div class="v14-region-table"><div class="v14-region-head"><span>區域／樓層</span><span>工項數</span><span>已完成</span><span>完工率</span><span>逾期（筆）</span><span>操作</span></div>${rows}</div></section></div>

function renderOwners(){let a=active(),assigned=a.filter(t=>t.internalOwner),unassigned=a.length-assigned.length,groups=[...new Set(assigned.map(t=>t.internalOwner))].map(name=>{let tasks=assigned.filter(t=>t.internalOwner===name);return {name,tasks,completed:tasks.filter(finished).length,rate:pctOf(tasks)}}).sort((x,y)=>y.tasks.length-x.tasks.length),mine=ownerSelected?assigned.filter(t=>t.internalOwner===ownerSelected):[],floors=[...new Set(mine.map(t=>t.floor))].map(name=>{let tasks=mine.filter(t=>t.floor===name);return {name,tasks,completed:tasks.filter(finished).length,rate:pctOf(tasks)}}).sort((a,b)=>b.tasks.length-a.tasks.length),shown=ownerFloor?mine.filter(t=>t.floor===ownerFloor):mine;return `<div class="exec-top" style="grid-template-columns:repeat(4,minmax(0,1fr))">${summaryKpi('工務部負責人',groups.length,'已指派人員')}${summaryKpi('有效工項',a.length,'工程主檔')}${summaryKpi('已指派工項',assigned.length,'每筆僅一位負責人','primary-kpi')}${summaryKpi('尚未指派',unassigned,'請於工項管理填寫',unassigned?'danger-kpi':'')}</div><div class="exec-owner-grid"><div class="panel"><h2>各工務部負責人工項分布</h2><div class="exec-subtitle">依負責工項數比較，點選人員可查看明細</div>${groups.length?chartRows(groups,'selectOwner',ownerSelected,'count'):'<div class="exec-empty">尚未指派工務部負責人。請先至「工項管理」填寫。</div>'}</div><div class="panel"><h2>各負責人完工率比較</h2><div class="exec-subtitle">已完成工項／各人負責工項</div>${groups.length?chartRows(groups,'selectOwner',ownerSelected):'<div class="exec-empty">待指派後自動產生統計圖表</div>'}</div></div><div class="panel exec-owner-summary"><h2>工務部負責人工作量總覽</h2><div class="exec-scroll"><table class="exec-mini-table"><thead><tr><th>工務部負責人</th><th>工項數</th><th>已完成</th><th>完工率</th><th>逾期</th><th>待結案</th><th>主要負責區域</th><th>操作</th></tr></thead><tbody>${groups.map(g=>`<tr onclick="selectOwner('${encodeURIComponent(g.name)}')"><td><b>${esc(g.name)}</b></td><td>${g.tasks.length}</td><td>${g.completed}</td><td>${bar(g.rate)}</td><td>${overdueNumber(g.tasks.filter(t=>overdue(t,'forecast')).length)}</td><td>${g.tasks.filter(t=>finished(t)&&!t.closed).length}</td><td>${esc([...new Set(g.tasks.map(t=>t.floor))].join('、'))}</td><td><button class="smallbutton">查看工項</button></td></tr>`).join('')||'<tr><td colspan="8" class="exec-empty">尚無人員資料</td></tr>'}</tbody></table></div></div>${ownerSelected?`<section class="exec-drill"><div class="exec-breadcrumb">工務部負責人管理 › ${esc(ownerSelected)} ${ownerFloor?' › '+esc(ownerFloor):''}</div><div class="exec-drill-header"><h2>${esc(ownerSelected)}｜工項明細</h2><button onclick="clearOwner()">← 返回全部人員</button></div>${kpiLine(mine)}<div class="exec-drill-grid" style="margin-top:14px"><div><div class="panel"><h2>負責區域（點選篩選）</h2>${chartRows(floors,'selectOwnerFloor',ownerFloor,'count')}</div><div class="panel"><div class="exec-toolbar"><h2>負責工項（${shown.length}筆）</h2>${ownerFloor?`<button onclick="ownerFloor='';render()">全部區域</button>`:''}</div>${table(shown)}</div></div>${blockersCompact(shown)}</div></section>`:''}<div class="exec-note">原始Excel沒有「工務部負責人」欄位，故不會將廠商負責人自動視為內部工務人員；請逐筆指派。每個工項只能指定一位工務部負責人。</div>`}

// 工項管理表格排序：預設編號升冪；再次點選同一欄位反轉方向。
let taskSortKey='id',taskSortDirection=1;
const taskSortColumns=[['id','編號'],['floor','區域／樓層'],['area','施工區域'],['vendor','廠商'],['trade','工種'],['owner','廠商負責人'],['internalOwner','工務部負責人'],['baseline','原訂完工'],['forecast','最新預計'],['progress','完成率'],['status','狀態'],['issueCategory','問題分類'],['issue','阻礙／缺失']];

function sortedTaskRows(tasks){return [...tasks].sort((a,b)=>{
 const av=taskSortValue(a,taskSortKey),bv=taskSortValue(b,taskSortKey);

 if(emptyA!==emptyB)return emptyA?1:-1; // 空值永遠排最後
 let cmp=0;
 if(taskSortKey==='id'||taskSortKey==='progress')cmp=(Number(av)||0)-(Number(bv)||0);
 else cmp=taskSortCollator.compare(String(av??''),String(bv??''));
 return cmp?cmp*taskSortDirection:(Number(a.id)||0)-(Number(b.id)||0);
 });}

 if(byDbId)id=t.id;
 const fieldMarkup=fields.map(([k,label,type])=>{
  const input=type==='textarea'?`<textarea id="e_${k}">${esc(t[k])}</textarea>`:`<input id="e_${k}" type="${type||'text'}" value="${esc(t[k])}" ${k==='baseline'&&id!==null?'disabled':''} ${k==='issueCategory'?'list="categories"':''} ${k==='progress'?'min="0" max="100" step="1"':''}>`;

 }).join('');
 show(`<h2>${id===null?'新增工項':'編輯工項 #'+esc(id)}</h2><datalist id="categories">${[...new Set(store.tasks.map(x=>x.issueCategory).filter(Boolean))].map(x=>`<option value="${esc(x)}"></option>`).join('')}</datalist><div class="form">${fieldMarkup}<div class="field wide"><label>變更原因（修改預計完工日或實際完工日時必填；僅修改完成率可留空）</label><textarea id="reason" placeholder="說明本次修改原因"></textarea></div></div><div class="actions"><button type="button" onclick="closeModal()">取消</button><button class="primary" onclick="saveEdit(editTaskId)">儲存變更</button></div>`);
 if(t._dbId)cloudList(t._dbId);

async function saveEdit(id){
 const old=id===null?null:store.tasks.find(x=>x._dbId===id||x.id===id);
 if(id!==null&&!old){alert('找不到工項（儲存識別碼：'+String(id)+'），請重新讀取');return;}
 const t=old?{...old}:{id:null};
 for(const [k] of fields){if(k==='baseline'&&old)continue;t[k]=$('e_'+k).value;}
 t.progress=Number(t.progress);
 if(!Number.isFinite(t.progress)||t.progress<0||t.progress>100){alert('完成率須介於 0–100');return;}
 const reason=$('reason').value.trim();
 if(old&&['forecast','actualEnd'].some(k=>String(old[k]||'')!==String(t[k]||''))&&!reason){alert('異動完工日期須填原因');return;}
 if(old&&t.progress<Number(old.progress)&&!reason){alert('進度倒退須填原因');return;}
 if(pendingFiles.daily.length||pendingFiles.issue.length||pendingDeletes.size){alert('附件尚未完成雲端儲存串接，請先取消附件異動，避免誤以為已上傳');return;}
 if(page==='daily'&&old)dailySavedFocus=old._dbId;const requestId='req_'+Date.now()+'_'+Math.random().toString(36).slice(2);
 window.engineeringPendingWrites=window.engineeringPendingWrites||new Set();window.engineeringPendingWrites.add(requestId);
 parent.postMessage({type:'ENGINEERING_TASK_SAVE',requestId,dbId:old?old._dbId:null,changes:t,reason},location.protocol==='file:'?'*':location.origin);
 const btn=$('modal').querySelector('.primary');if(btn){btn.disabled=true;btn.textContent='正在儲存 Supabase…';}
}

function markAll(){alert('每日確認尚未串接雲端');return;if(!confirm('確定要將目前所有有效工項勾選為已確認？請先核對進度。'))return;let d=store.daily[dailyDate]||{checks:{},submitted:false};active().forEach(t=>d.checks[t.id]=true);store.daily[dailyDate]=d;save();render()}
function submitDaily(){alert('Web 測試版目前僅供查閱，資料修改功能尚待安全串接 Supabase。');return;let d=store.daily[dailyDate]||{checks:{},submitted:false},missing=active().filter(t=>!d.checks[t.id]);if(missing.length){alert(`尚有 ${missing.length} 筆未確認，請逐項核對。`);return}d.submitted=true;d.submittedAt=new Date().toISOString();d.snapshot=active().map(t=>({id:t.id,progress:t.progress,forecast:t.forecast}));store.daily[dailyDate]=d;log('提交每日確認',dailyDate,`已確認 ${d.snapshot.length} 筆工項`);alert('本機展示：每日確認已記錄。');render()}
function issueEdit(i){let x=i===undefined?{taskId:'',description:'',owner:'',due:'',level:'待分級',status:'待處理'}:store.issues[i];show(`<h2>${i===undefined?'新增':'編輯'}異常案件</h2><div class="form">${[['taskId','關聯工項編號'],['description','異常內容'],['owner','改善責任人'],['due','改善期限'],['level','異常等級'],['status','處理狀態']].map(([k,label])=>`<div class="field"><label>${label}</label>${k==='level'?`<select id="i_${k}">${['待分級','一般','重大'].map(y=>`<option ${x[k]===y?'selected':''}>${y}</option>`)}</select>`:k==='status'?`<select id="i_${k}">${['待處理','改善中','已結案'].map(y=>`<option ${x[k]===y?'selected':''}>${y}</option>`)}</select>`:`<input id="i_${k}" type="${k==='due'?'date':'text'}" value="${esc(x[k])}">`}</div>`).join('')}</div><div class="actions"><button type="button" onclick="closeModal()">取消</button><button class="primary" onclick="saveIssue(${i===undefined?'null':i})">儲存</button></div>`)}
function saveIssue(i){alert('Web 測試版目前僅供查閱，資料修改功能尚待安全串接 Supabase。');return;let x={};for(let k of ['taskId','description','owner','due','level','status'])x[k]=$('i_'+k).value;if(!x.description||!x.taskId){alert('請輸入關聯工項與異常內容');return}if(i===null)store.issues.push(x);else store.issues[i]=x;log(i===null?'新增異常':'修改異常',x.taskId,JSON.stringify(x));closeModal();render()}
function download(name,data,type){let a=document.createElement('a'),url=URL.createObjectURL(new Blob([data],{type}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
async function backup(){try{let attachments={};for(const t of store.tasks)for(const a of t.attachments||[]){let blob=await dbGet(a.key);if(!blob)throw Error('附件遺失：'+a.name);attachments[a.key]=await bytesToDataURL(blob)}download('85_Project_V144_Backup_'+today()+'.json',JSON.stringify({...store,_attachmentFiles:attachments},null,2),'application/json;charset=utf-8');alert('完整備份已下載，包含 '+Object.keys(attachments).length+' 個附件。請將檔案另存至安全位置。')}catch(e){alert('完整備份失敗：'+e.message)}}

 async function restoreFile(f){alert('Web 測試版目前僅供查閱，資料修改功能尚待安全串接 Supabase。');return;if(!f)return;try{let x=JSON.parse(await f.text());if(!Array.isArray(x.tasks)||!Array.isArray(x.history))throw Error('備份格式不正確');if(!confirm('還原將取代目前瀏覽器內的所有資料，確定嗎？'))return;let files=x._attachmentFiles||{};for(const [key,uri] of Object.entries(files))await dbPut(key,dataURLToBlob(uri));delete x._attachmentFiles;store=x;save();render();alert('還原完成。附件檔案 '+Object.keys(files).length+' 個。')}catch(e){alert('還原失敗：'+e.message)}}

<script>
window.addEventListener('message',event=>{
 if(event.source!==parent||(location.protocol==='file:'?event.origin!=='null':event.origin!==location.origin)||!event.data||event.data.type!=='ENGINEERING_DATA')return;
 window.__engineeringDataReceived=true;const rows=Array.isArray(event.data.tasks)?event.data.tasks:[];
 cloudTaskId=null;cloudAttachments=[];store.tasks=rows.map(t=>({_dbId:t.id,_isLegacy:t.legacy_id!==null&&t.legacy_id!==undefined,id:t.legacy_id??String(t.id).slice(0,8),floor:t.floor||'',area:t.area||'',vendor:t.vendor||'',trade:t.trade||'',owner:t.owner||'',internalOwner:t.internal_owner||'',progress:Number(t.progress)||0,baseline:t.baseline||'',forecast:t.forecast||'',planStart:t.plan_start||'',actualStart:t.actual_start||'',actualEnd:t.actual_end||'',issueCategory:t.issue_category||'',issue:t.issue||'',issueDue:t.issue_due||'',daily:t.daily||'',note:t.note||'',closed:!!t.closed,cancelled:!!t.cancelled,attachments:[]}));
 window.engineeringCanEdit=event.data.canEdit===true;store.history=event.data.history||[];store.issues=[];store.daily={};store.importConflicts=[];
 try{siteName=event.data.projectName||siteName;siteCode=event.data.projectCode||siteCode;if(!window.__engineeringDataReceivedBefore){page='dashboard';window.__engineeringDataReceivedBefore=true;}render();}catch(err){document.getElementById('content').textContent='畫面載入失敗：'+err.message;}
});
window.addEventListener('message',e=>{if(e.source!==parent||(location.protocol==='file:'?e.origin!=='null':e.origin!==location.origin)||!e.data||e.data.type!=='ENGINEERING_WRITE_RESULT')return;if(e.data.success){closeModal();if(page==='daily'){$('versionState')&&($('versionState').textContent='已儲存工項，正在更新畫面…')}else alert('已儲存 Supabase，畫面正在重新讀取');}else{alert('儲存失敗：'+e.data.error);const b=$('modal').querySelector('.primary');if(b){b.disabled=false;b.textContent='儲存變更';}}});

// Daily versioning bridge: snapshots are created by a SECURITY DEFINER RPC, not browser state.
let dailyVersionRequestCounter=0;
function requestDailyVersions(){if(page!=='daily')return;parent.postMessage({type:'ENGINEERING_DAILY_VERSIONS',date:dailyDate,requestId:'v'+(++dailyVersionRequestCounter)},location.protocol==='file:'?'*':location.origin)}
function submitDailyVersion(){if(!confirm('確定提交 '+dailyDate+' 的最新快照？同日再次提交將覆蓋當日快照，但會留下提交時間紀錄。'))return;const btn=$('submitVersionBtn');if(btn)btn.disabled=true;parent.postMessage({type:'ENGINEERING_DAILY_SUBMIT',date:dailyDate,reason:($('backfillReason')?.value||'').trim(),requestId:'submit'+Date.now()},location.protocol==='file:'?'*':location.origin)}
window.addEventListener('message',e=>{if(e.source!==parent||!e.data)return;
 if(e.data.type==='ENGINEERING_DAILY_VERSION_RESULT'){
  const state=$('versionState'),box=$('dailyVersionHistory');if(!state||!box||page!=='daily'||e.data.date!==dailyDate)return;
  if(e.data.error){state.textContent='讀取失敗';box.textContent=e.data.error;return;}
  const versions=e.data.versions||[];state.textContent=versions.length?'最後提交：'+new Date(versions[0].submitted_at).toLocaleString('zh-TW',{timeZone:'Asia/Taipei'}):'今日尚未提交';
  box.innerHTML=versions.length?'<b>當日最新快照</b><div class="toolbar"><button onclick="openDailyVersion(1)">查看最新快照｜'+esc(versions[0].submitted_by)+'｜'+esc(new Date(versions[0].submitted_at).toLocaleString('zh-TW',{timeZone:'Asia/Taipei'}))+'</button></div><div class="muted">同日重送會更新快照；每次提交的時間與人員另存稽核紀錄。</div>':'今日尚未提交';
 }
 if(e.data.type==='ENGINEERING_DAILY_SUBMIT_RESULT'){
  const btn=$('submitVersionBtn');if(btn)btn.disabled=false;
  if(!e.data.success){alert('提交失敗：'+(e.data.error||'未知錯誤'));return;}
  alert('已更新當日最新快照，共 '+e.data.task_count+' 筆工項。');requestDailyVersions();
 }
 if(e.data.type==='ENGINEERING_DAILY_DETAIL_RESULT'){
  if(e.data.error){alert(e.data.error);return;}
  const d=e.data.detail||{};show('<h2>當日最新快照｜'+esc(d.report_date)+'</h2><p>提交人：'+esc(d.submitted_by)+'｜提交時間：'+esc(d.submitted_at)+'</p><p>快照工項數：'+esc((d.snapshot||[]).length)+'</p><div class="scroll"><table><thead><tr><th>編號</th><th>區域</th><th>完成率</th><th>最新預計</th><th>今日進度</th></tr></thead><tbody>'+(d.snapshot||[]).map(t=>'<tr><td>'+esc(t.legacy_id??String(t.id).slice(0,8))+'</td><td>'+esc(t.area)+'</td><td>'+esc(t.progress)+'%</td><td>'+esc(t.forecast)+'</td><td>'+esc(t.daily)+'</td></tr>').join('')+'</tbody></table></div>');
 }
});
function openDailyVersion(version){parent.postMessage({type:'ENGINEERING_DAILY_DETAIL',date:dailyDate,version_no:version},location.protocol==='file:'?'*':location.origin)}

// Repeat READY until parent sends data; handles iframe/parent initialization races.
(function announce(){if(window.__engineeringDataReceived)return;parent.postMessage({type:'ENGINEERING_READY'},location.protocol==='file:'?'*':location.origin);setTimeout(announce,750)})();
</script>

<script>
/* Sort only the displayed table rows. No Supabase writes or changes to calculations.
   Delegation works with existing render() replacing #content. */
(function(){
 const content=document.getElementById('content');
 const collator=new Intl.Collator('zh-Hant',{numeric:true,sensitivity:'base'});
 function norm(cell){return (cell?.textContent||'').trim().replace(/\s+/g,' ');}
 function numeric(s){const n=Number(s.replace(/[,％%]/g,'').trim());return s.trim()!=='' && Number.isFinite(n)?n:null;}
 function dateValue(s){return /^\d{4}[-/]\d{1,2}[-/]\d{1,2}$/.test(s)?Date.parse(s.replaceAll('/','-')):null;}
 function cmp(a,b){
  const empty=x=>!x||x==='—'||x==='-';
  if(empty(a)||empty(b))return empty(a)===empty(b)?0:(empty(a)?1:-1);
  const ad=dateValue(a),bd=dateValue(b);
  if(ad!==null&&bd!==null)return ad-bd;
  const an=numeric(a),bn=numeric(b);
  if(an!==null&&bn!==null)return an-bn;
  return collator.compare(a,b);
 }
 function prepare(){
  if(!['dashboard','owners','regions'].includes(window.page||page))return;
  content.querySelectorAll('table').forEach(table=>{
   if(table.dataset.multiSort==='yes')return;
   const tbody=table.tBodies[0],head=table.tHead;
   if(!tbody||!head||tbody.rows.length===0)return;
   table.dataset.multiSort='yes';
   Array.from(head.rows[head.rows.length-1].cells).forEach((th,i)=>{
    if(/^(操作|查看)$/.test(norm(th)))return;
    th.dataset.sortCol=String(i);th.tabIndex=0;th.setAttribute('role','button');
    th.setAttribute('aria-label','依'+norm(th)+'排序');
   });
  });
 }
 function sort(th){
  const table=th.closest('table'),tbody=table.tBodies[0],index=Number(th.dataset.sortCol);
  const asc=th.dataset.sortDir!=='asc';
  const rows=Array.from(tbody.rows).map((row,i)=>({row,i,value:norm(row.cells[index])}));
  rows.sort((a,b)=>{const blank=x=>!x||x==='—'||x==='-';if(blank(a.value)!==blank(b.value))return blank(a.value)?1:-1;const c=cmp(a.value,b.value);return c===0?a.i-b.i:(asc?c:-c)});
  const frag=document.createDocumentFragment();rows.forEach(({row})=>frag.appendChild(row));tbody.appendChild(frag);
  table.querySelectorAll('thead th[data-sort-col]').forEach(h=>{delete h.dataset.sortDir;h.removeAttribute('aria-sort')});
  th.dataset.sortDir=asc?'asc':'desc';th.setAttribute('aria-sort',asc?'ascending':'descending');
 }
 content.addEventListener('click',e=>{const th=e.target.closest('th[data-sort-col]');if(th&&content.contains(th))sort(th)});
 content.addEventListener('keydown',e=>{const th=e.target.closest('th[data-sort-col]');if(th&&(e.key==='Enter'||e.key===' ')){e.preventDefault();sort(th)}});
 const observer=new MutationObserver(prepare);observer.observe(content,{childList:true,subtree:false});prepare();
})();
</script>
